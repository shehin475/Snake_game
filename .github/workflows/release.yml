name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.15.0

      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name NokiaSnake --collect-all mediapipe --collect-all cv2
          --collect-all pygame --collect-all numpy main.py

      - name: Package release download
        run: Compress-Archive -Path dist\NokiaSnake.exe -DestinationPath dist\NokiaSnake-Windows.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/NokiaSnake-Windows.zip
